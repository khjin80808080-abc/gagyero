<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>가계Ro — 모바일 인터랙티브 목업</title>
<style>
  :root {
    --hero: linear-gradient(160deg, #33127a 0%, #7c3aed 32%, #c026d3 62%, #fb923c 100%);
    --bg: #ffffff;
    --fg: #171717;
    --n-900: #171717;
    --n-500: #737373;
    --n-400: #a3a3a3;
    --n-100: #f5f5f5;
    --n-50: #fafafa;
    --violet-100: #ede9fe;
    --violet-700: #6d28d9;
    --orange-100: #ffedd5;
    --orange-700: #c2410c;
    --line: rgba(0,0,0,0.08);
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, Helvetica, sans-serif;
    background: #e5e5e5;
    color: var(--fg);
  }

  .stage {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 24px 12px;
  }

  .stage-label {
    font-size: 13px;
    color: #666;
    font-weight: 600;
    letter-spacing: 0.02em;
  }

  .phone {
    position: relative;
    width: 390px;
    height: 844px;
    max-height: 92vh;
    background: var(--bg);
    border-radius: 44px;
    border: 10px solid #111;
    box-shadow: 0 30px 60px rgba(0,0,0,0.35);
    overflow: hidden;
  }

  .phone-screen {
    position: absolute;
    inset: 0;
    overflow: hidden;
  }

  /* On real mobile viewports, drop the decorative phone chrome entirely */
  @media (max-width: 480px), (max-height: 700px) {
    body { background: var(--bg); }
    .stage { padding: 0; gap: 0; }
    .stage-label { display: none; }
    .phone {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      max-height: none;
      border-radius: 0;
      border: none;
      box-shadow: none;
    }
  }

  .screen {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    background: var(--bg);
    padding-bottom: 88px;
  }
  .screen.active { display: flex; }

  a, button, input, label { font-family: inherit; }
  button { cursor: pointer; border: none; background: none; font: inherit; color: inherit; }

  /* ---------- Home ---------- */
  .hero {
    position: relative;
    flex: none;
    padding: 32px 20px 40px;
    color: #fff;
    background: var(--hero);
    overflow: hidden;
  }
  .hero .blob-a {
    position: absolute; right: -64px; top: 160px; width: 256px; height: 256px;
    border-radius: 999px; background: rgba(253,186,116,0.3); filter: blur(60px); pointer-events: none;
  }
  .hero .blob-b {
    position: absolute; left: -80px; bottom: 96px; width: 288px; height: 288px;
    border-radius: 999px; background: rgba(232,121,249,0.2); filter: blur(60px); pointer-events: none;
  }
  .brand { position: relative; font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
  .hero h1 { position: relative; margin: 28px 0 0; font-size: 26px; font-weight: 700; line-height: 1.3; }
  .hero p.sub { position: relative; margin: 8px 0 0; font-size: 14px; color: rgba(255,255,255,0.8); }
  .badge {
    position: relative; margin-top: 16px; display: inline-flex; align-items: center; gap: 6px;
    width: fit-content; border-radius: 999px; background: rgba(255,255,255,0.15);
    padding: 6px 12px; font-size: 12px; font-weight: 500;
  }

  .input-grid {
    position: relative; margin-top: 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
  }
  .upload-card {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    border-radius: 16px; background: rgba(255,255,255,0.95); padding: 24px 8px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.06); text-align: center; text-decoration: none;
    color: inherit; transition: background 0.15s;
  }
  .upload-card:active { background: #fff; }
  .upload-card .icon-circle {
    display: flex; align-items: center; justify-content: center; width: 48px; height: 48px;
    border-radius: 999px; background: linear-gradient(135deg, var(--violet-100), var(--orange-100));
    font-size: 22px;
  }
  .upload-card .label { font-size: 14px; font-weight: 500; color: #262626; }
  .upload-card input[type=file] { display: none; }

  .status-line { position: relative; margin-top: 12px; text-align: center; font-size: 12px; color: rgba(255,255,255,0.85); min-height: 16px; }

  .month-card {
    position: relative; margin-top: 24px; border-radius: 16px; background: rgba(255,255,255,0.95);
    padding: 16px; box-shadow: 0 1px 2px rgba(0,0,0,0.06);
  }
  .month-card .cap { font-size: 12px; color: var(--n-500); }
  .month-card .val { margin-top: 4px; font-size: 20px; font-weight: 700; color: var(--n-900); }

  /* ---------- Section headers (history / monthly) ---------- */
  .page-hero {
    flex: none; border-radius: 0 0 32px 32px; padding: 32px 20px 24px; color: #fff; background: var(--hero);
  }
  .page-hero h1 { margin: 0; font-size: 18px; font-weight: 700; }
  .page-hero .total { margin: 16px 0 0; font-size: 36px; font-weight: 800; letter-spacing: -0.01em; }
  .page-hero .compare { margin: 8px 0 0; font-size: 14px; color: rgba(255,255,255,0.85); }

  .section { padding: 24px 20px 8px; }
  .section-title { margin: 0; font-size: 14px; font-weight: 600; color: var(--n-500); }

  .list {
    margin-top: 12px; border-radius: 16px; background: var(--n-50); box-shadow: 0 1px 2px rgba(0,0,0,0.06);
    overflow: hidden;
  }
  .list-row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 12px 16px; border-bottom: 1px solid var(--n-100);
  }
  .list-row:last-child { border-bottom: none; }
  .list-row.clickable { width: 100%; text-align: left; }
  .list-row.clickable:active { background: rgba(0,0,0,0.03); }
  .row-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .row-left .name { font-size: 14px; font-weight: 500; color: var(--n-900); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-left .meta { margin-top: 2px; font-size: 12px; color: var(--n-400); }
  .row-amount { flex: none; font-size: 14px; font-weight: 600; color: var(--n-900); }

  .icon-badge {
    flex: none; display: flex; align-items: center; justify-content: center; width: 36px; height: 36px;
    border-radius: 999px; background: linear-gradient(135deg, var(--violet-100), var(--orange-100)); font-size: 16px;
  }
  .rank-badge {
    flex: none; display: flex; align-items: center; justify-content: center; width: 24px; height: 24px;
    border-radius: 999px; font-size: 11px; font-weight: 600;
  }
  .rank-badge.violet { background: var(--violet-100); color: var(--violet-700); }
  .rank-badge.orange { background: var(--orange-100); color: var(--orange-700); }

  .empty-msg { padding: 32px 0; text-align: center; font-size: 14px; color: var(--n-400); }

  /* ---------- AI ---------- */
  .center-msg { flex: 1; display: flex; align-items: center; justify-content: center; padding: 0 20px; }
  .center-msg p { color: rgba(0,0,0,0.4); font-size: 14px; }

  /* ---------- Write ---------- */
  .write-wrap { padding: 32px 20px 40px; }
  .back-link { font-size: 14px; color: var(--n-400); background: none; padding: 0; }
  .write-wrap h1 { margin: 16px 0 0; font-size: 20px; font-weight: 700; }
  .form { margin-top: 24px; display: flex; flex-direction: column; gap: 20px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 12px; font-weight: 500; color: var(--n-500); }
  .field input, .field textarea {
    border-radius: 12px; border: 1px solid var(--n-100); padding: 10px 12px; font-size: 14px;
    outline: none; background: #fff; color: var(--fg);
  }
  .field input:focus, .field textarea:focus { border-color: #c4b5fd; }
  .field textarea { resize: vertical; font-family: inherit; }
  .btn-submit {
    margin-top: 8px; border-radius: 16px; background: #171717; padding: 13px; font-size: 14px;
    font-weight: 600; color: #fff; text-align: center;
  }
  .btn-submit:active { background: #262626; }
  .form-error { font-size: 13px; color: #dc2626; margin: -8px 0 0; }

  /* ---------- Detail ---------- */
  .detail-wrap { padding: 32px 20px 40px; }
  .detail-amount-block { margin-top: 24px; }
  .detail-amount-block .merchant { font-size: 20px; font-weight: 700; color: var(--n-900); }
  .detail-amount-block .amount { margin-top: 6px; font-size: 30px; font-weight: 800; letter-spacing: -0.01em; }
  .detail-meta {
    margin-top: 20px; border-radius: 16px; background: var(--n-50); padding: 4px 16px;
  }
  .detail-meta .row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--n-100); font-size: 13px; }
  .detail-meta .row:last-child { border-bottom: none; }
  .detail-meta .row .k { color: var(--n-500); }
  .detail-meta .row .v { color: var(--n-900); font-weight: 500; }

  .source-box {
    margin-top: 12px; border-radius: 16px; border: 1.5px dashed #d4d4d4; background: var(--n-50);
    padding: 28px 16px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center;
  }
  .source-box .icon { font-size: 32px; }
  .source-box .cap { font-size: 13px; font-weight: 600; color: var(--n-900); }
  .source-box .sub { font-size: 12px; color: var(--n-400); }
  .source-text {
    margin-top: 12px; border-radius: 16px; background: var(--n-50); padding: 14px 16px; font-size: 13px;
    color: var(--n-900); line-height: 1.6; white-space: pre-wrap;
  }

  .lineitems { margin-top: 12px; border-radius: 16px; background: var(--n-50); overflow: hidden; }
  .lineitems .li-row { display: flex; justify-content: space-between; padding: 10px 16px; font-size: 13px; border-bottom: 1px solid var(--n-100); }
  .lineitems .li-row:last-child { border-bottom: none; }
  .lineitems .li-row .n { color: var(--n-900); }
  .lineitems .li-row .a { color: var(--n-500); }

  /* ---------- Bottom nav ---------- */
  .bottom-nav {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 10;
    border-top: 1px solid var(--line); background: var(--bg);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .bottom-nav .row { display: flex; align-items: stretch; }
  .nav-item {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 8px 0; font-size: 11px; color: rgba(0,0,0,0.4); text-decoration: none;
  }
  .nav-item .ic { font-size: 20px; line-height: 1; }
  .nav-item.active { color: var(--fg); font-weight: 600; }

  .toast {
    position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%);
    background: rgba(23,23,23,0.92); color: #fff; font-size: 13px; padding: 10px 16px;
    border-radius: 999px; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity 0.2s;
    z-index: 20; max-width: 85%; overflow: hidden; text-overflow: ellipsis;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="stage">
  <div class="stage-label">가계Ro · 모바일 인터랙티브 목업 (샘플 데이터)</div>
  <div class="phone">
    <div class="phone-screen" id="phone-screen">

      <!-- HOME -->
      <section class="screen" data-route="home">
        <div class="hero">
          <div class="blob-a"></div>
          <div class="blob-b"></div>
          <span class="brand">가계Ro</span>
          <h1>자료 몰아넣기</h1>
          <p class="sub">영수증·캡처·파일을 넣으면 AI가 자동 분류·정리해요</p>
          <span class="badge">✨ 나도 쓸 수 있는 AI 가계부</span>

          <div class="input-grid">
            <label class="upload-card" data-upload="receipt">
              <span class="icon-circle">🧾</span>
              <span class="label">촬영 등록</span>
              <input type="file" accept="image/*" capture="environment" />
            </label>
            <label class="upload-card" data-upload="screenshot">
              <span class="icon-circle">🖼️</span>
              <span class="label">캡처 등록</span>
              <input type="file" accept="image/*" multiple />
            </label>
            <label class="upload-card" data-upload="file">
              <span class="icon-circle">📁</span>
              <span class="label">파일 등록</span>
              <input type="file" accept="image/*,application/pdf" multiple />
            </label>
            <a class="upload-card" href="#/write">
              <span class="icon-circle">✍️</span>
              <span class="label">글로 등록</span>
            </a>
          </div>

          <p class="status-line" id="home-status"></p>

          <div class="month-card">
            <p class="cap">이번 달 지출</p>
            <p class="val" id="home-month-total">0원</p>
          </div>
        </div>
      </section>

      <!-- HISTORY -->
      <section class="screen" data-route="history">
        <div class="page-hero" style="border-radius:0 0 32px 32px; padding-bottom:24px;">
          <h1>내역</h1>
        </div>
        <div class="section" style="padding-top:24px;" id="history-list"></div>
      </section>

      <!-- DETAIL -->
      <section class="screen" data-route="detail">
        <div class="detail-wrap" id="detail-body"></div>
      </section>

      <!-- MONTHLY -->
      <section class="screen" data-route="monthly">
        <div class="page-hero">
          <h1>이번 달</h1>
          <p class="total" id="monthly-total">0원</p>
          <p class="compare" id="monthly-compare"></p>
        </div>
        <div class="section">
          <h2 class="section-title">많이 사용한 곳</h2>
          <div class="list" id="monthly-merchants"></div>
        </div>
        <div class="section">
          <h2 class="section-title">큰 지출</h2>
          <div class="list" id="monthly-expenses"></div>
        </div>
      </section>

      <!-- AI -->
      <section class="screen" data-route="ai">
        <div class="center-msg"><p>준비 중</p></div>
      </section>

      <!-- WRITE -->
      <section class="screen" data-route="write">
        <div class="write-wrap">
          <button class="back-link" data-nav="home">← 취소</button>
          <h1>글쓰기로 등록</h1>
          <form class="form" id="write-form">
            <div class="field">
              <label for="f-date">날짜</label>
              <input id="f-date" name="occurredOn" type="date" required />
            </div>
            <div class="field">
              <label for="f-time">시간 (선택)</label>
              <input id="f-time" name="occurredTime" type="time" />
            </div>
            <div class="field">
              <label for="f-merchant">사용처</label>
              <input id="f-merchant" name="merchantName" type="text" required placeholder="예: 스타벅스" />
            </div>
            <div class="field">
              <label for="f-amount">금액</label>
              <input id="f-amount" name="amount" type="number" inputmode="numeric" min="1" step="1" required placeholder="0" />
            </div>
            <div class="field">
              <label for="f-memo">메모 (선택)</label>
              <textarea id="f-memo" name="memo" rows="3"></textarea>
            </div>
            <p class="form-error" id="write-error" style="display:none;"></p>
            <button type="submit" class="btn-submit">저장</button>
          </form>
        </div>
      </section>

      <!-- Bottom nav -->
      <nav class="bottom-nav">
        <div class="row">
          <a class="nav-item" data-nav="home" href="#/"><span class="ic">🏠</span>홈</a>
          <a class="nav-item" data-nav="monthly" href="#/monthly"><span class="ic">📅</span>이번달</a>
          <a class="nav-item" data-nav="history" href="#/history"><span class="ic">📋</span>내역</a>
          <a class="nav-item" data-nav="ai" href="#/ai"><span class="ic">🤖</span>AI</a>
        </div>
      </nav>

      <div class="toast" id="toast"></div>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  // ---------------------------------------------------------------------
  // Sample data (in-memory only — no server / DB, mirrors prisma schema)
  // ---------------------------------------------------------------------
  var KIND_ICON = { receipt: "🧾", voice: "🎤", manual: "✍️", screenshot: "🖼️", file: "📁" };
  var KIND_LABEL = { receipt: "촬영 등록 (영수증 사진)", voice: "말하기", manual: "글로 등록", screenshot: "캡처 등록", file: "파일 등록" };

  var nextId = 1;
  function ymd(d) {
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function addDays(base, n) {
    var d = new Date(base);
    d.setDate(d.getDate() + n);
    return d;
  }
  function addMonths(base, n) {
    var d = new Date(base);
    d.setMonth(d.getMonth() + n);
    return d;
  }
  function makeTx(daysOffset, time, merchantName, amount, kind, extra) {
    var d = addDays(new Date(), daysOffset);
    var tx = {
      id: nextId++,
      occurredOn: ymd(d),
      occurredTime: time || null,
      merchantName: merchantName,
      amount: amount,
      memo: (extra && extra.memo) || null,
      kind: kind || "manual",
      rawText: (extra && extra.rawText) || null,
      lineItems: (extra && extra.lineItems) || [],
    };
    return tx;
  }
  function makeTxOnDate(dateObj, time, merchantName, amount, kind, extra) {
    var tx = makeTx(0, time, merchantName, amount, kind, extra);
    tx.occurredOn = ymd(dateObj);
    return tx;
  }

  var today = new Date();
  var lastMonthAnchor = addMonths(today, -1);

  var transactions = [
    makeTx(0, "08:12", "스타벅스 강남점", 6800, "receipt", { lineItems: [{ name: "카페라떼", amount: 5000 }, { name: "사이즈업", amount: 1800 }] }),
    makeTx(0, "13:04", "김밥천국", 8000, "receipt"),
    makeTx(0, "19:41", "CU 편의점", 4500, "receipt"),
    makeTx(-1, "12:20", "이마트 장보기", 63200, "screenshot", {
      lineItems: [{ name: "우유", amount: 3200 }, { name: "계란 한판", amount: 7500 }, { name: "생필품 외", amount: 52500 }],
    }),
    makeTx(-1, null, "친구에게 점심값 정산", 15000, "voice", { rawText: "어제 친구랑 점심 먹은거 만오천원 정산" }),
    makeTx(-3, "20:10", "배달의민족", 18700, "screenshot"),
    makeTx(-5, "09:30", "GS25", 3200, "receipt"),
    makeTx(-12, "18:00", "넷플릭스 정기결제", 17000, "file", { rawText: "이메일 영수증 PDF" }),
    makeTx(-12, null, "KT 통신요금", 55000, "file"),
    makeTx(-18, "11:15", "올리브영", 24700, "receipt"),
  ];

  // A couple of transactions in the *previous* month, within the same
  // day-of-month window, so the "지난달 같은 기간 비교" stat has data.
  transactions.push(makeTxOnDate(new Date(lastMonthAnchor.getFullYear(), lastMonthAnchor.getMonth(), Math.max(1, today.getDate() - 6)), "09:00", "스타벅스 강남점", 6800, "receipt"));
  transactions.push(makeTxOnDate(new Date(lastMonthAnchor.getFullYear(), lastMonthAnchor.getMonth(), Math.max(1, today.getDate() - 2)), "19:00", "이마트 장보기", 41200, "screenshot"));
  transactions.push(makeTxOnDate(new Date(lastMonthAnchor.getFullYear(), lastMonthAnchor.getMonth(), Math.max(1, today.getDate() - 1)), null, "월세", 550000, "manual"));

  var UPLOAD_POOL = {
    receipt: [
      { merchantName: "스타벅스 강남점", amount: 6800 },
      { merchantName: "CU 편의점", amount: 4500 },
      { merchantName: "김밥천국", amount: 8000 },
      { merchantName: "올리브영", amount: 24700 },
    ],
    screenshot: [
      { merchantName: "쿠팡", amount: 32900 },
      { merchantName: "배달의민족", amount: 18700 },
    ],
    file: [
      { merchantName: "국민연금공단", amount: 220000 },
      { merchantName: "KT 통신요금", amount: 55000 },
    ],
  };

  function pad2(n) { return String(n).padStart(2, "0"); }
  function nowTimeStr() {
    var d = new Date();
    return pad2(d.getHours()) + ":" + pad2(d.getMinutes());
  }

  function findDuplicate(merchantName, occurredOn, occurredTime, amount) {
    return transactions.find(function (t) {
      return t.merchantName === merchantName && t.occurredOn === occurredOn && t.occurredTime === occurredTime && t.amount === amount;
    });
  }

  // ---------------------------------------------------------------------
  // Formatting helpers (mirror app/page.tsx & friends)
  // ---------------------------------------------------------------------
  function formatWon(amount) { return amount.toLocaleString("ko-KR") + "원"; }
  function dateFromYmd(ymdStr) {
    var parts = ymdStr.split("-").map(Number);
    return new Date(parts[0], parts[1] - 1, parts[2]);
  }
  function formatDateHeading(ymdStr) {
    return dateFromYmd(ymdStr).toLocaleDateString("ko-KR", { month: "long", day: "numeric" });
  }
  function formatDateFull(ymdStr) {
    return dateFromYmd(ymdStr).toLocaleDateString("ko-KR", { year: "numeric", month: "long", day: "numeric", weekday: "long" });
  }

  // ---------------------------------------------------------------------
  // Summary queries (mirror app/lib/summary.ts)
  // ---------------------------------------------------------------------
  function getSortedTransactions() {
    return transactions.slice().sort(function (a, b) {
      if (a.occurredOn !== b.occurredOn) return a.occurredOn < b.occurredOn ? 1 : -1;
      return b.id - a.id;
    });
  }

  function currentMonthRange() {
    var now = new Date();
    var monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
    var nextMonthStart = new Date(now.getFullYear(), now.getMonth() + 1, 1);
    return { monthStart: monthStart, nextMonthStart: nextMonthStart };
  }

  function inRange(ymdStr, start, endExclusive) {
    var d = dateFromYmd(ymdStr);
    return d >= start && d < endExclusive;
  }

  function getCurrentMonthTotal() {
    var r = currentMonthRange();
    return transactions.filter(function (t) { return inRange(t.occurredOn, r.monthStart, r.nextMonthStart); })
      .reduce(function (sum, t) { return sum + t.amount; }, 0);
  }

  function getLastMonthSamePeriodTotal() {
    var now = new Date();
    var lastMonthStart = new Date(now.getFullYear(), now.getMonth() - 1, 1);
    var lastMonthSamePeriodEnd = new Date(now.getFullYear(), now.getMonth() - 1, now.getDate() + 1);
    return transactions.filter(function (t) { return inRange(t.occurredOn, lastMonthStart, lastMonthSamePeriodEnd); })
      .reduce(function (sum, t) { return sum + t.amount; }, 0);
  }

  function getTopMerchantsThisMonth(limit) {
    var r = currentMonthRange();
    var byMerchant = {};
    transactions.forEach(function (t) {
      if (!inRange(t.occurredOn, r.monthStart, r.nextMonthStart)) return;
      if (!byMerchant[t.merchantName]) byMerchant[t.merchantName] = { merchantName: t.merchantName, totalAmount: 0, count: 0 };
      byMerchant[t.merchantName].totalAmount += t.amount;
      byMerchant[t.merchantName].count += 1;
    });
    return Object.values(byMerchant).sort(function (a, b) { return b.totalAmount - a.totalAmount; }).slice(0, limit);
  }

  function getTopExpensesThisMonth(limit) {
    var r = currentMonthRange();
    return transactions.filter(function (t) { return inRange(t.occurredOn, r.monthStart, r.nextMonthStart); })
      .sort(function (a, b) { return b.amount - a.amount; })
      .slice(0, limit);
  }

  // ---------------------------------------------------------------------
  // Toast
  // ---------------------------------------------------------------------
  var toastEl = document.getElementById("toast");
  var toastTimer = null;
  function showToast(text) {
    toastEl.textContent = text;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, 1800);
  }

  // ---------------------------------------------------------------------
  // Renderers
  // ---------------------------------------------------------------------
  function renderHome() {
    document.getElementById("home-month-total").textContent = formatWon(getCurrentMonthTotal());
  }

  function rowMarkup(t) {
    return (
      '<button class="list-row clickable" data-open-detail="' + t.id + '">' +
        '<div class="row-left">' +
          '<span class="icon-badge">' + (KIND_ICON[t.kind] || "✍️") + "</span>" +
          '<div>' +
            '<p class="name">' + escapeHtml(t.merchantName) + "</p>" +
            '<p class="meta">' + (t.occurredTime || "시간 미상") + "</p>" +
          "</div>" +
        "</div>" +
        '<span class="row-amount">' + formatWon(t.amount) + "</span>" +
      "</button>"
    );
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function renderHistory() {
    var sorted = getSortedTransactions();
    var groups = [];
    sorted.forEach(function (t) {
      var last = groups[groups.length - 1];
      if (last && last.dateKey === t.occurredOn) {
        last.items.push(t);
      } else {
        groups.push({ dateKey: t.occurredOn, heading: formatDateHeading(t.occurredOn), items: [t] });
      }
    });

    var el = document.getElementById("history-list");
    if (groups.length === 0) {
      el.innerHTML = '<p class="empty-msg">아직 등록된 기록이 없습니다.</p>';
      return;
    }
    el.innerHTML = groups.map(function (g) {
      return (
        '<section style="margin-bottom:24px;">' +
          '<h2 class="section-title">' + g.heading + "</h2>" +
          '<div class="list" style="margin-top:12px;">' + g.items.map(rowMarkup).join("") + "</div>" +
        "</section>"
      );
    }).join("");
  }

  function renderMonthly() {
    var totalSpent = getCurrentMonthTotal();
    var lastPeriod = getLastMonthSamePeriodTotal();
    var diff = totalSpent - lastPeriod;
    var diffLabel = diff >= 0 ? "더" : "적게";

    document.getElementById("monthly-total").textContent = formatWon(totalSpent);
    document.getElementById("monthly-compare").textContent = "지난달 같은 기간보다 " + formatWon(Math.abs(diff)) + " " + diffLabel + " 사용";

    var merchants = getTopMerchantsThisMonth(5);
    var merchantsEl = document.getElementById("monthly-merchants");
    merchantsEl.innerHTML = merchants.length === 0
      ? '<p class="empty-msg">아직 기록이 없어요</p>'
      : merchants.map(function (m, i) {
          return (
            '<div class="list-row">' +
              '<div class="row-left">' +
                '<span class="rank-badge violet">' + (i + 1) + "</span>" +
                '<div><p class="name">' + escapeHtml(m.merchantName) + '</p><p class="meta">' + m.count + "건</p></div>" +
              "</div>" +
              '<span class="row-amount">' + formatWon(m.totalAmount) + "</span>" +
            "</div>"
          );
        }).join("");

    var expenses = getTopExpensesThisMonth(5);
    var expensesEl = document.getElementById("monthly-expenses");
    expensesEl.innerHTML = expenses.length === 0
      ? '<p class="empty-msg">아직 기록이 없어요</p>'
      : expenses.map(function (e, i) {
          return (
            '<button class="list-row clickable" data-open-detail="' + e.id + '">' +
              '<div class="row-left">' +
                '<span class="rank-badge orange">' + (i + 1) + "</span>" +
                '<div><p class="name">' + escapeHtml(e.merchantName) + '</p><p class="meta">' + formatDateHeading(e.occurredOn) + "</p></div>" +
              "</div>" +
              '<span class="row-amount">' + formatWon(e.amount) + "</span>" +
            "</button>"
          );
        }).join("");
  }

  function renderDetail(id) {
    var t = transactions.find(function (x) { return x.id === id; });
    var body = document.getElementById("detail-body");
    if (!t) {
      body.innerHTML = '<button class="back-link" data-nav="history">← 목록으로</button><p class="empty-msg">거래를 찾을 수 없습니다.</p>';
      return;
    }

    var sourceMarkup;
    if (t.kind === "voice" || t.kind === "manual") {
      sourceMarkup = '<div class="source-text">' + escapeHtml(t.rawText || t.memo || "등록된 원문이 없습니다.") + "</div>";
    } else {
      var capMap = { receipt: "영수증 원본 이미지", screenshot: "캡처 이미지", file: "첨부 파일" };
      sourceMarkup =
        '<div class="source-box">' +
          '<span class="icon">' + KIND_ICON[t.kind] + "</span>" +
          '<span class="cap">' + (capMap[t.kind] || "원본 자료") + "</span>" +
          '<span class="sub">샘플 목업에서는 실제 이미지를 표시하지 않습니다</span>' +
        "</div>";
    }

    var lineItemsMarkup = "";
    if (t.lineItems && t.lineItems.length > 0) {
      lineItemsMarkup =
        '<h2 class="section-title" style="margin-top:20px;">품목</h2>' +
        '<div class="lineitems" style="margin-top:12px;">' +
          t.lineItems.map(function (li) {
            return '<div class="li-row"><span class="n">' + escapeHtml(li.name) + '</span><span class="a">' + formatWon(li.amount) + "</span></div>";
          }).join("") +
        "</div>";
    }

    body.innerHTML =
      '<button class="back-link" data-nav="history">← 목록으로</button>' +
      '<div class="detail-amount-block">' +
        '<p class="merchant">' + escapeHtml(t.merchantName) + "</p>" +
        '<p class="amount">' + formatWon(t.amount) + "</p>" +
      "</div>" +
      '<div class="detail-meta">' +
        '<div class="row"><span class="k">날짜</span><span class="v">' + formatDateFull(t.occurredOn) + "</span></div>" +
        '<div class="row"><span class="k">시간</span><span class="v">' + (t.occurredTime || "시간 미상") + "</span></div>" +
        '<div class="row"><span class="k">등록 방법</span><span class="v">' + KIND_ICON[t.kind] + " " + KIND_LABEL[t.kind] + "</span></div>" +
      "</div>" +
      '<h2 class="section-title" style="margin-top:20px;">원본 확인</h2>' +
      sourceMarkup +
      (t.kind === "manual" && t.memo ? '<div class="source-text" style="margin-top:12px;">메모: ' + escapeHtml(t.memo) + "</div>" : "") +
      lineItemsMarkup;
  }

  // ---------------------------------------------------------------------
  // Upload simulation (mirrors app/components/InputGrid.tsx)
  // ---------------------------------------------------------------------
  var homeStatus = document.getElementById("home-status");
  var uploadBusy = false;

  function handleUpload(kind, files) {
    if (!files || files.length === 0 || uploadBusy) return;
    var list = Array.prototype.slice.call(files);
    uploadBusy = true;
    homeStatus.textContent = "";
    var done = 0;
    var duplicateSeen = false;

    function step() {
      if (done >= list.length) {
        uploadBusy = false;
        homeStatus.textContent = duplicateSeen ? "이미 등록된 내역입니다." : "";
        renderHome();
        return;
      }
      homeStatus.textContent = list.length + "개 자료 중 " + done + "개 처리 중";
      setTimeout(function () {
        var pool = UPLOAD_POOL[kind] || UPLOAD_POOL.receipt;
        var pick = pool[Math.floor(Math.random() * pool.length)];
        var occurredOn = ymd(new Date());
        var occurredTime = nowTimeStr();
        var dup = findDuplicate(pick.merchantName, occurredOn, occurredTime, pick.amount);
        if (dup) {
          duplicateSeen = true;
        } else {
          transactions.push(makeTxFromExtract(pick, occurredOn, occurredTime, kind));
        }
        done += 1;
        step();
      }, 500);
    }
    step();
  }

  function makeTxFromExtract(pick, occurredOn, occurredTime, kind) {
    return {
      id: nextId++,
      occurredOn: occurredOn,
      occurredTime: occurredTime,
      merchantName: pick.merchantName,
      amount: pick.amount,
      memo: null,
      kind: kind,
      rawText: null,
      lineItems: [],
    };
  }

  document.querySelectorAll(".upload-card[data-upload]").forEach(function (card) {
    var input = card.querySelector('input[type="file"]');
    var kind = card.getAttribute("data-upload");
    input.addEventListener("change", function () {
      handleUpload(kind, input.files);
      input.value = "";
    });
  });

  // ---------------------------------------------------------------------
  // Write form (mirrors app/write/actions.ts)
  // ---------------------------------------------------------------------
  var writeForm = document.getElementById("write-form");
  var writeError = document.getElementById("write-error");

  function resetWriteForm() {
    writeForm.reset();
    document.getElementById("f-date").value = ymd(new Date());
    writeError.style.display = "none";
  }

  writeForm.addEventListener("submit", function (e) {
    e.preventDefault();
    var fd = new FormData(writeForm);
    var occurredOn = fd.get("occurredOn") || ymd(new Date());
    var occurredTime = fd.get("occurredTime") || null;
    var merchantName = (fd.get("merchantName") || "").toString().trim();
    var amount = parseInt(fd.get("amount"), 10);
    var memo = (fd.get("memo") || "").toString().trim() || null;

    if (!merchantName || !Number.isFinite(amount) || amount <= 0) {
      writeError.textContent = "사용처와 금액을 올바르게 입력해 주세요.";
      writeError.style.display = "block";
      return;
    }

    transactions.push({
      id: nextId++,
      occurredOn: occurredOn,
      occurredTime: occurredTime,
      merchantName: merchantName,
      amount: amount,
      memo: memo,
      kind: "manual",
      rawText: memo,
      lineItems: [],
    });

    resetWriteForm();
    showToast("등록되었습니다");
    navigate("#/history");
  });

  // ---------------------------------------------------------------------
  // Router
  // ---------------------------------------------------------------------
  var screens = {};
  document.querySelectorAll(".screen").forEach(function (s) { screens[s.getAttribute("data-route")] = s; });
  var navItems = document.querySelectorAll(".nav-item");

  function routeFromHash() {
    var hash = location.hash.replace(/^#/, "") || "/";
    if (hash === "/" || hash === "") return { name: "home" };
    if (hash === "/history") return { name: "history" };
    if (hash === "/monthly") return { name: "monthly" };
    if (hash === "/ai") return { name: "ai" };
    if (hash === "/write") return { name: "write" };
    var m = hash.match(/^\/history\/(\d+)$/);
    if (m) return { name: "detail", id: parseInt(m[1], 10) };
    return { name: "home" };
  }

  function render() {
    var route = routeFromHash();
    Object.keys(screens).forEach(function (key) { screens[key].classList.toggle("active", key === route.name); });

    navItems.forEach(function (item) {
      var target = item.getAttribute("data-nav");
      item.classList.toggle("active", target === route.name);
    });

    if (route.name === "home") renderHome();
    else if (route.name === "history") renderHistory();
    else if (route.name === "monthly") renderMonthly();
    else if (route.name === "detail") renderDetail(route.id);
    else if (route.name === "write") resetWriteForm();

    document.getElementById("phone-screen").scrollTop = 0;
    var activeScreen = screens[route.name];
    if (activeScreen) activeScreen.scrollTop = 0;
  }

  function navigate(hash) {
    if (location.hash === hash) { render(); return; }
    location.hash = hash;
  }

  document.addEventListener("click", function (e) {
    var backBtn = e.target.closest("[data-nav]");
    if (backBtn && backBtn.tagName === "BUTTON") {
      e.preventDefault();
      navigate(backBtn.getAttribute("data-nav") === "home" ? "#/" : "#/" + backBtn.getAttribute("data-nav"));
      return;
    }
    var detailBtn = e.target.closest("[data-open-detail]");
    if (detailBtn) {
      e.preventDefault();
      navigate("#/history/" + detailBtn.getAttribute("data-open-detail"));
    }
  });

  window.addEventListener("hashchange", render);
  render();
})();
</script>
</body>
</html>
